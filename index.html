// ---------- vocabulario ligado a la librería de figuras ----------
const VOCABULARIO = [
  { id: "sol", p: "sol" }, { id: "casa", p: "casa" }, { id: "gato", p: "gato" }, { id: "pez", p: "pez" },
  { id: "flor", p: "flor" }, { id: "pelota", p: "pelota" }, { id: "auto", p: "auto" }, { id: "manzana", p: "manzana" },
  { id: "arbol", p: "árbol" }, { id: "luna", p: "luna" }, { id: "estrella", p: "estrella" }, { id: "globo", p: "globo" },
];

const FIGURAS_MEMORIA = ["sol", "gato", "pez", "flor", "pelota", "auto", "estrella", "manzana"];

// ---------- almacenamiento con fallback ----------
const memFallback = {};
async function guardar(clave, valor) {
  try { localStorage.setItem(clave, JSON.stringify(valor)); }
  catch (e) { memFallback[clave] = JSON.stringify(valor); }
}
async function leer(clave) {
  try { const r = localStorage.getItem(clave); return r ? JSON.parse(r) : null; }
  catch (e) { return memFallback[clave] ? JSON.parse(memFallback[clave]) : null; }
}

// ---------- utilidades ----------
const mezclar = (arr) => [...arr].sort(() => Math.random() - 0.5);
const azar = (n) => Math.floor(Math.random() * n);

// ============================================================
// Pantalla de resultado compartida
// ============================================================
function Resultado({ puntos, maximo, onRepetir, onSalir }) {
  const ratio = maximo > 0 ? puntos / maximo : 0;
  const estrellas = ratio >= 0.8 ? 3 : ratio >= 0.5 ? 2 : 1;
  const mensaje = estrellas === 3 ? "¡Increíble!" : estrellas === 2 ? "¡Muy bien!" : "¡Buen intento!";
  return (
    <div className="flex flex-col items-center gap-5 py-8 sm:gap-6 sm:py-10">
      <div className="text-6xl sm:text-7xl">{estrellas === 3 ? "🏆" : estrellas === 2 ? "🎉" : "💪"}</div>
      <h2 className="text-3xl font-black text-slate-800 sm:text-4xl">{mensaje}</h2>
      <div className="flex gap-2">
        {[1, 2, 3].map((n) => (
          <Star key={n} className={`h-10 w-10 sm:h-12 sm:w-12 ${n <= estrellas ? "fill-yellow-400 text-yellow-400" : "text-slate-300"}`} />
        ))}
      </div>
      <p className="text-xl font-bold text-slate-600 sm:text-2xl">{puntos} de {maximo} puntos</p>
      <div className="flex flex-wrap justify-center gap-3 sm:gap-4">
        <button onClick={onRepetir} className="flex items-center gap-2 rounded-full bg-sky-500 px-6 py-3 text-lg font-black text-white shadow-lg active:scale-95 sm:px-8 sm:py-4 sm:text-xl">
          <RotateCcw /> Otra vez
        </button>
        <button onClick={onSalir} className="flex items-center gap-2 rounded-full bg-slate-200 px-6 py-3 text-lg font-black text-slate-700 active:scale-95 sm:px-8 sm:py-4 sm:text-xl">
          <Home /> Menú
        </button>
      </div>
    </div>
  );
}

// ============================================================
// Juego 1 — Memoria de pares (Cognitiva) — ahora con figuras SVG
// ============================================================
function JuegoMemoria({ edad, alTerminar }) {
  const pares = edad === "3-5" ? 3 : 6;
  const crear = useCallback(() => {
    const elegidas = mezclar(FIGURAS_MEMORIA).slice(0, pares);
    return mezclar([...elegidas, ...elegidas].map((f, i) => ({ id: i, figura: f, vista: false, lista: false })));
  }, [pares]);

  const [cartas, setCartas] = useState(crear);
  const [seleccion, setSeleccion] = useState([]);
  const [intentos, setIntentos] = useState(0);
  const [fin, setFin] = useState(false);
  const bloqueo = useRef(false);

  const tocar = (idx) => {
    if (bloqueo.current || cartas[idx].vista || cartas[idx].lista) return;
    const nuevas = cartas.map((c, i) => (i === idx ? { ...c, vista: true } : c));
    const sel = [...seleccion, idx];
    setCartas(nuevas);
    setSeleccion(sel);
    if (sel.length === 2) {
      bloqueo.current = true;
      setIntentos((v) => v + 1);
      const [a, b] = sel;
      setTimeout(() => {
        setCartas((prev) => {
          const acierto = prev[a].figura === prev[b].figura;
          const res = prev.map((c, i) =>
            i === a || i === b ? { ...c, vista: acierto, lista: acierto ? true : c.lista } : c
          );
          if (res.every((c) => c.lista)) setFin(true);
          return res;
        });
        setSeleccion([]);
        bloqueo.current = false;
      }, 800);
    }
  };

  useEffect(() => {
    if (fin) {
      const maximo = pares * 10;
      const puntos = Math.max(pares * 10 - Math.max(0, intentos - pares) * 2, pares * 2);
      alTerminar(puntos, maximo);
    }
  }, [fin]); // eslint-disable-line

  return (
    <div className="flex flex-col items-center gap-5 sm:gap-6">
      <p className="text-center text-lg font-bold text-slate-600 sm:text-xl">Encontrá las parejas iguales 🔍</p>
      <div className={`grid w-full max-w-xs gap-2 sm:max-w-sm sm:gap-3 ${pares <= 3 ? "grid-cols-3" : "grid-cols-4"}`}>
        {cartas.map((c, i) => (
          <button
            key={c.id}
            onClick={() => tocar(i)}
            className={`flex aspect-square w-full items-center justify-center rounded-2xl p-2 shadow-md transition-transform active:scale-95 ${
              c.vista || c.lista ? "bg-white" : "bg-violet-400"
            }`}
          >
            {c.vista || c.lista
              ? <Figura id={c.figura} edad={edad} className="h-full w-full" />
              : <span className="text-3xl sm:text-4xl">❓</span>}
          </button>
        ))}
      </div>
      <p className="text-base font-bold text-violet-600 sm:text-lg">Intentos: {intentos}</p>
    </div>
  );
}

// ============================================================
// Juego 2 — ¿Qué sigue? Patrones (Cognitiva)
// ============================================================
function JuegoPatrones({ edad, alTerminar }) {
  const TOTAL = 8;
  const fichas = edad === "3-5" ? ["🔴", "🔵", "🟡"] : ["🔴", "🔵", "🟡", "🟢", "🟣"];

  const generarRonda = useCallback(() => {
    if (edad === "3-5") {
      const [a, b] = mezclar(fichas);
      const ops = new Set([b]);
      while (ops.size < 3) ops.add(fichas[azar(fichas.length)]);
      return { secuencia: [a, b, a, b, a], respuesta: b, opciones: mezclar([...ops]) };
    }
    const tipo = azar(3);
    const [a, b, c] = mezclar(fichas);
    let sec, resp;
    if (tipo === 0) { sec = [a, b, a, b, a]; resp = b; }
    else if (tipo === 1) { sec = [a, a, b, b, a]; resp = a; }
    else { sec = [a, b, c, a, b]; resp = c; }
    const ops = new Set([resp]);
    while (ops.size < 3) ops.add(fichas[azar(fichas.length)]);
    return { secuencia: sec, respuesta: resp, opciones: mezclar([...ops]) };
  }, [edad]); // eslint-disable-line

  const [ronda, setRonda] = useState(generarRonda);
  const [num, setNum] = useState(1);
  const [puntos, setPuntos] = useState(0);
  const [marca, setMarca] = useState(null);

  const responder = (op) => {
    if (marca) return;
    const ok = op === ronda.respuesta;
    setMarca(ok ? "bien" : "mal");
    const nuevos = ok ? puntos + 1 : puntos;
    if (ok) setPuntos(nuevos);
    setTimeout(() => {
      if (num >= TOTAL) alTerminar(nuevos, TOTAL);
      else { setNum(num + 1); setRonda(generarRonda()); setMarca(null); }
    }, 900);
  };

  return (
    <div className="flex flex-col items-center gap-5 sm:gap-6">
      <p className="text-center text-lg font-bold text-slate-600 sm:text-xl">¿Qué ficha sigue en la fila? 🤔</p>
      <div className="flex flex-wrap items-center justify-center gap-1.5 rounded-3xl bg-white p-4 shadow-md sm:gap-2 sm:p-5">
        {ronda.secuencia.map((f, i) => <span key={i} className="text-3xl sm:text-4xl">{f}</span>)}
        <span className="flex h-10 w-10 items-center justify-center rounded-xl border-4 border-dashed border-violet-300 text-xl font-black text-violet-400 sm:h-12 sm:w-12 sm:text-2xl">?</span>
      </div>
      <div className="flex gap-3 sm:gap-4">
        {ronda.opciones.map((op, i) => (
          <button key={i} onClick={() => responder(op)}
            className={`flex h-16 w-16 items-center justify-center rounded-2xl text-4xl shadow-md transition-transform active:scale-90 sm:h-20 sm:w-20 sm:text-5xl ${
              marca && op === ronda.respuesta ? "bg-green-200" : marca === "mal" ? "bg-red-100" : "bg-white"
            }`}>
            {op}
          </button>
        ))}
      </div>
      {marca && <p className="text-xl font-black sm:text-2xl">{marca === "bien" ? "✅ ¡Sí!" : `❌ Era ${ronda.respuesta}`}</p>}
      <p className="text-base font-bold text-violet-600 sm:text-lg">Ronda {num} de {TOTAL} · Puntos: {puntos}</p>
    </div>
  );
}

// ============================================================
// Juego 3 — Súper cuentas (Cognitiva, 6-8)
// ============================================================
function JuegoMatematicas({ alTerminar }) {
  const TOTAL = 10;
  const generar = () => {
    let n1 = azar(20) + 1, n2 = azar(20) + 1;
    const suma = azar(2) === 0;
    if (!suma && n1 < n2) [n1, n2] = [n2, n1];
    const resp = suma ? n1 + n2 : n1 - n2;
    const ops = new Set([resp]);
    while (ops.size < 3) {
      const dd = resp + (azar(9) - 4);
      if (dd >= 0 && dd !== resp) ops.add(dd);
    }
    return { n1, n2, suma, resp, opciones: mezclar([...ops]) };
  };

  const [p, setP] = useState(generar);
  const [num, setNum] = useState(1);
  const [puntos, setPuntos] = useState(0);
  const [marca, setMarca] = useState(null);

  const responder = (op) => {
    if (marca !== null) return;
    const ok = op === p.resp;
    setMarca(op);
    const nuevos = ok ? puntos + 1 : puntos;
    if (ok) setPuntos(nuevos);
    setTimeout(() => {
      if (num >= TOTAL) alTerminar(nuevos, TOTAL);
      else { setNum(num + 1); setP(generar()); setMarca(null); }
    }, 900);
  };

  return (
    <div className="flex flex-col items-center gap-5 sm:gap-6">
      <p className="text-center text-lg font-bold text-slate-600 sm:text-xl">Resolvé la cuenta 🧮</p>
      <div className="rounded-3xl bg-white px-8 py-6 shadow-md sm:px-10 sm:py-8">
        <p className="text-5xl font-black text-slate-800 sm:text-6xl">{p.n1} {p.suma ? "+" : "−"} {p.n2}</p>
      </div>
      <div className="flex gap-3 sm:gap-4">
        {p.opciones.map((op) => (
          <button key={op} onClick={() => responder(op)}
            className={`h-16 w-16 rounded-2xl text-2xl font-black shadow-md transition-transform active:scale-90 sm:h-20 sm:w-20 sm:text-3xl ${
              marca !== null && op === p.resp ? "bg-green-300 text-green-900"
              : marca === op ? "bg-red-200 text-red-800" : "bg-white text-slate-700"
            }`}>
            {op}
          </button>
        ))}
      </div>
      <p className="text-base font-bold text-violet-600 sm:text-lg">Cuenta {num} de {TOTAL} · Puntos: {puntos}</p>
    </div>
  );
}

// ============================================================
// Juego 4 — Nombra la figura (Lenguaje) — con figuras SVG
// ============================================================
function JuegoPalabras({ edad, alTerminar }) {
  const TOTAL = 8;
  const banco = edad === "3-5" ? VOCABULARIO.slice(0, 8) : VOCABULARIO;
  const generar = useCallback(() => {
    const item = banco[azar(banco.length)];
    const ops = new Set([item.p]);
    while (ops.size < 3) ops.add(banco[azar(banco.length)].p);
    return { ...item, opciones: mezclar([...ops]) };
  }, [edad]); // eslint-disable-line

  const [r, setR] = useState(generar);
  const [num, setNum] = useState(1);
  const [puntos, setPuntos] = useState(0);
  const [marca, setMarca] = useState(null);

  const responder = (op) => {
    if (marca !== null) return;
    const ok = op === r.p;
    setMarca(op);
    const nuevos = ok ? puntos + 1 : puntos;
    if (ok) setPuntos(nuevos);
    setTimeout(() => {
      if (num >= TOTAL) alTerminar(nuevos, TOTAL);
      else { setNum(num + 1); setR(generar()); setMarca(null); }
    }, 900);
  };

  return (
    <div className="flex flex-col items-center gap-5 sm:gap-6">
      <p className="text-center text-lg font-bold text-slate-600 sm:text-xl">¿Cómo se llama esto? 👀</p>
      <div className="flex h-36 w-36 items-center justify-center rounded-3xl bg-white p-3 shadow-md sm:h-44 sm:w-44">
        <Figura id={r.id} edad={edad} className="h-full w-full" />
      </div>
      <div className="flex w-full max-w-xs flex-col gap-3">
        {r.opciones.map((op) => (
          <button key={op} onClick={() => responder(op)}
            className={`w-full rounded-full px-8 py-3 text-xl font-black shadow-md transition-transform active:scale-95 sm:py-4 sm:text-2xl ${
              marca !== null && op === r.p ? "bg-green-300 text-green-900"
              : marca === op ? "bg-red-200 text-red-800" : "bg-amber-400 text-amber-950"
            }`}>
            {op}
          </button>
        ))}
      </div>
      <p className="text-base font-bold text-amber-600 sm:text-lg">Figura {num} de {TOTAL} · Puntos: {puntos}</p>
    </div>
  );
}

// ============================================================
// Juego 5 — Primera letra (Lenguaje, 6-8) — con figuras SVG
// ============================================================
function JuegoLetras({ alTerminar }) {
  const TOTAL = 8;
  const generar = () => {
    const item = VOCABULARIO[azar(VOCABULARIO.length)];
    const inicial = item.p[0].toUpperCase();
    const abec = "ABCDEFGLMNPRSTV".split("");
    const ops = new Set([inicial]);
    while (ops.size < 4) ops.add(abec[azar(abec.length)]);
    return { ...item, inicial, opciones: mezclar([...ops]) };
  };

  const [r, setR] = useState(generar);
  const [num, setNum] = useState(1);
  const [puntos, setPuntos] = useState(0);
  const [marca, setMarca] = useState(null);

  const responder = (op) => {
    if (marca !== null) return;
    const ok = op === r.inicial;
    setMarca(op);
    const nuevos = ok ? puntos + 1 : puntos;
    if (ok) setPuntos(nuevos);
    setTimeout(() => {
      if (num >= TOTAL) alTerminar(nuevos, TOTAL);
      else { setNum(num + 1); setR(generar()); setMarca(null); }
    }, 900);
  };

  return (
    <div className="flex flex-col items-center gap-5 sm:gap-6">
      <p className="text-center text-lg font-bold text-slate-600 sm:text-xl">¿Con qué letra empieza? ✏️</p>
      <div className="flex flex-col items-center gap-2 rounded-3xl bg-white px-8 py-5 shadow-md sm:px-10 sm:py-6">
        <Figura id={r.id} edad="6-8" className="h-24 w-24 sm:h-28 sm:w-28" />
        <span className="text-2xl font-black text-slate-800 sm:text-3xl">_{r.p.slice(1)}</span>
      </div>
      <div className="flex gap-2.5 sm:gap-3">
        {r.opciones.map((op) => (
          <button key={op} onClick={() => responder(op)}
            className={`h-14 w-14 rounded-2xl text-2xl font-black shadow-md transition-transform active:scale-90 sm:h-16 sm:w-16 sm:text-3xl ${
              marca !== null && op === r.inicial ? "bg-green-300 text-green-900"
              : marca === op ? "bg-red-200 text-red-800" : "bg-amber-400 text-amber-950"
            }`}>
            {op}
          </button>
        ))}
      </div>
      <p className="text-base font-bold text-amber-600 sm:text-lg">Palabra {num} de {TOTAL} · Puntos: {puntos}</p>
    </div>
  );
}

// ============================================================
// Juego 6 — Atrapa al bichito (Psicomotricidad) — con SVG
// ============================================================
function JuegoAtrapa({ edad, alTerminar }) {
  const DURACION = 30;
  const velocidad = edad === "3-5" ? 2000 : 1200;
  const tamano = edad === "3-5" ? "h-20 w-20 sm:h-24 sm:w-24" : "h-12 w-12 sm:h-16 sm:w-16";
  const [pos, setPos] = useState({ x: 40, y: 40 });
  const [atrapados, setAtrapados] = useState(0);
  const [tiempo, setTiempo] = useState(DURACION);
  const [activo, setActivo] = useState(false);
  const meta = edad === "3-5" ? 10 : 15;

  const mover = () => setPos({ x: 5 + azar(70), y: 5 + azar(65) });

  useEffect(() => {
    if (!activo) return;
    const reloj = setInterval(() => setTiempo((t) => t - 1), 1000);
    const salto = setInterval(mover, velocidad);
    return () => { clearInterval(reloj); clearInterval(salto); };
  }, [activo, velocidad]);

  useEffect(() => {
    if (activo && tiempo <= 0) alTerminar(Math.min(atrapados, meta), meta);
  }, [tiempo]); // eslint-disable-line

  if (!activo) {
    return (
      <div className="flex flex-col items-center gap-5 py-8 sm:gap-6 sm:py-10">
        <Bichito className="h-24 w-24 sm:h-28 sm:w-28" />
        <p className="max-w-xs text-center text-lg font-bold text-slate-600 sm:text-xl">
          ¡El bichito se escapa! Tocalo cada vez que aparezca. Tenés {DURACION} segundos.
        </p>
        <button onClick={() => setActivo(true)}
          className="rounded-full bg-emerald-500 px-10 py-4 text-xl font-black text-white shadow-lg active:scale-95 sm:px-12 sm:py-5 sm:text-2xl">
          ¡A jugar!
        </button>
      </div>
    );
  }

  return (
    <div className="flex flex-col items-center gap-4">
      <div className="flex w-full max-w-md justify-between text-lg font-black sm:text-xl">
        <span className="text-emerald-600">🐞 {atrapados}</span>
        <span className={tiempo <= 5 ? "text-red-500" : "text-slate-600"}>⏰ {tiempo}s</span>
      </div>
      <div className="relative h-72 w-full max-w-md overflow-hidden rounded-3xl bg-lime-100 shadow-inner sm:h-96">
        <button
          onClick={() => { setAtrapados((v) => v + 1); mover(); }}
          className={`absolute ${tamano} active:scale-75`}
          style={{ left: `${pos.x}%`, top: `${pos.y}%` }}
          aria-label="Atrapar bichito"
        >
          <Bichito className="h-full w-full" />
        </button>
      </div>
    </div>
  );
}

// ============================================================
// Panel para padres
// ============================================================
function PanelPadres({ sesiones, perfil }) {
  const porArea = Object.keys(AREAS).map((clave) => {
    const del = sesiones.filter((s) => s.area === clave);
    const jugadas = del.length;
    const promedio = jugadas > 0 ? Math.round((del.reduce((a, s) => a + s.puntos / s.maximo, 0) / jugadas) * 100) : 0;
    return { clave, jugadas, promedio };
  });
  const ultimas = [...sesiones].reverse().slice(0, 8);

  return (
    <div className="flex w-full max-w-md flex-col gap-5 sm:gap-6">
      <div className="rounded-3xl bg-white p-5 shadow-md sm:p-6">
        <h3 className="mb-4 text-lg font-black text-slate-800 sm:text-xl">Progreso por área</h3>
        {porArea.map(({ clave, jugadas, promedio }) => (
          <div key={clave} className="mb-4">
            <div className="mb-1 flex flex-wrap justify-between gap-1 text-sm font-bold text-slate-600">
              <span>{AREAS[clave].icono} {AREAS[clave].nombre} — {AREAS[clave].desc}</span>
              <span>{jugadas > 0 ? `${promedio}%` : "sin datos"}</span>
            </div>
            <div className="h-4 w-full overflow-hidden rounded-full bg-slate-100">
              <div className={`h-full rounded-full ${AREAS[clave].color}`} style={{ width: `${promedio}%` }} />
            </div>
            <p className="mt-1 text-xs text-slate-400">{jugadas} {jugadas === 1 ? "partida" : "partidas"}</p>
          </div>
        ))}
      </div>

      <div className="rounded-3xl bg-white p-5 shadow-md sm:p-6">
        <h3 className="mb-3 text-lg font-black text-slate-800 sm:text-xl">Últimas partidas</h3>
        {ultimas.length === 0 ? (
          <p className="text-slate-500">Todavía no hay partidas. ¡Que {perfil?.nombre || "tu peque"} empiece a jugar para ver su progreso acá!</p>
        ) : (
          ultimas.map((s, i) => {
            const juego = JUEGOS.find((j) => j.id === s.juego);
            return (
              <div key={i} className="flex items-center justify-between border-b border-slate-100 py-2 last:border-0">
                <span className="font-bold text-slate-700">{juego?.icono} {juego?.nombre}</span>
                <span className={`font-black ${s.puntos / s.maximo >= 0.7 ? "text-green-600" : "text-amber-600"}`}>
                  {s.puntos}/{s.maximo}
                </span>
              </div>
            );
          })
        )}
      </div>

      <div className="rounded-3xl bg-sky-50 p-5 text-sm text-slate-600">
        <p className="font-bold text-slate-700">💡 Sugerencia</p>
        <p>
          {(() => {
            const sinJugar = porArea.filter((a) => a.jugadas === 0);
            if (sinJugar.length > 0) return `Todavía no exploraron el área "${AREAS[sinJugar[0].clave].nombre}". Probar juegos variados estimula el desarrollo integral.`;
            const menor = porArea.reduce((a, b) => (a.promedio <= b.promedio ? a : b));
            return `El área con más espacio para crecer es "${AREAS[menor.clave].nombre}". Repetir juegos cortos varias veces por semana ayuda más que sesiones largas.`;
          })()}
        </p>
      </div>
    </div>
  );
}

// ============================================================
// App principal
// ============================================================
function PequeMundo() {
  const [pantalla, setPantalla] = useState("cargando");
  const [perfil, setPerfil] = useState(null);
  const [sesiones, setSesiones] = useState([]);
  const [juegoActivo, setJuegoActivo] = useState(null);
  const [resultado, setResultado] = useState(null);
  const [nombreInput, setNombreInput] = useState("");
  const [edadInput, setEdadInput] = useState(null);
  const [claveJuego, setClaveJuego] = useState(0);

  useEffect(() => {
    (async () => {
      const p = await leer("pequemundo:perfil");
      const s = await leer("pequemundo:sesiones");
      if (s) setSesiones(s);
      if (p) { setPerfil(p); setPantalla("menu"); }
      else setPantalla("perfil");
    })();
  }, []);

  const crearPerfil = () => {
    if (!nombreInput.trim() || !edadInput) return;
    const p = { nombre: nombreInput.trim(), edad: edadInput };
    setPerfil(p);
    guardar("pequemundo:perfil", p);
    setPantalla("menu");
  };

  const terminarJuego = (puntos, maximo) => {
    const s = { juego: juegoActivo.id, area: juegoActivo.area, puntos, maximo, fecha: Date.now() };
    const nuevas = [...sesiones, s];
    setSesiones(nuevas);
    guardar("pequemundo:sesiones", nuevas);
    setResultado({ puntos, maximo });
  };

  const abrirJuego = (j) => { setJuegoActivo(j); setResultado(null); setClaveJuego((k) => k + 1); setPantalla("juego"); };
  const repetir = () => { setResultado(null); setClaveJuego((k) => k + 1); };

  if (pantalla === "cargando") {
    return <div className="flex min-h-screen items-center justify-center bg-sky-100 text-2xl font-black text-sky-600">Cargando… 🎈</div>;
  }

  if (pantalla === "perfil") {
    return (
      <div className="flex min-h-screen flex-col items-center justify-center gap-6 bg-sky-100 p-4 sm:gap-8 sm:p-6">
        <div className="text-center">
          <div className="text-6xl sm:text-7xl">🌈</div>
          <h1 className="mt-2 text-4xl font-black text-sky-700 sm:text-5xl">PequeMundo</h1>
          <p className="mt-2 text-base font-bold text-slate-500 sm:text-lg">Jugar, pensar, hablar y mover</p>
        </div>
        <div className="flex w-full max-w-sm flex-col gap-4 rounded-3xl bg-white p-5 shadow-lg sm:p-6">
          <label className="text-base font-black text-slate-700 sm:text-lg">¿Cómo se llama tu peque?</label>
          <input
            value={nombreInput}
            onChange={(e) => setNombreInput(e.target.value)}
            placeholder="Escribí su nombre"
            className="rounded-2xl border-4 border-sky-200 px-4 py-3 text-lg font-bold text-slate-700 outline-none focus:border-sky-400 sm:text-xl"
          />
          <label className="text-base font-black text-slate-700 sm:text-lg">¿Qué edad tiene?</label>
          <div className="flex gap-3">
            {["3-5", "6-8"].map((e) => (
              <button key={e} onClick={() => setEdadInput(e)}
                className={`flex-1 rounded-2xl py-3 text-lg font-black transition-transform active:scale-95 sm:py-4 sm:text-xl ${
                  edadInput === e ? "bg-sky-500 text-white shadow-md" : "bg-sky-100 text-sky-700"
                }`}>
                {e} años
              </button>
            ))}
          </div>
          <button onClick={crearPerfil}
            disabled={!nombreInput.trim() || !edadInput}
            className="mt-2 rounded-full bg-emerald-500 py-3 text-xl font-black text-white shadow-lg transition-transform active:scale-95 disabled:opacity-40 sm:py-4 sm:text-2xl">
            ¡Empezar a jugar!
          </button>
        </div>
      </div>
    );
  }

  if (pantalla === "juego" && juegoActivo) {
    return (
      <div className="min-h-screen bg-sky-100 p-3 sm:p-4">
        <div className="mx-auto flex max-w-lg flex-col gap-4 sm:gap-6">
          <div className="flex flex-wrap items-center justify-between gap-2">
            <button onClick={() => setPantalla("menu")} className="flex items-center gap-1 rounded-full bg-white px-4 py-2 font-black text-slate-600 shadow active:scale-95">
              <ArrowLeft /> Volver
            </button>
            <span className="text-lg font-black text-slate-700 sm:text-xl">{juegoActivo.icono} {juegoActivo.nombre}</span>
          </div>
          <div className="rounded-3xl bg-sky-50 p-3 sm:p-4">
            {resultado ? (
              <Resultado puntos={resultado.puntos} maximo={resultado.maximo} onRepetir={repetir} onSalir={() => setPantalla("menu")} />
            ) : (
              <div key={claveJuego}>
                {juegoActivo.id === "memoria" && <JuegoMemoria edad={perfil.edad} alTerminar={terminarJuego} />}
                {juegoActivo.id === "patrones" && <JuegoPatrones edad={perfil.edad} alTerminar={terminarJuego} />}
                {juegoActivo.id === "matematicas" && <JuegoMatematicas alTerminar={terminarJuego} />}
                {juegoActivo.id === "palabras" && <JuegoPalabras edad={perfil.edad} alTerminar={terminarJuego} />}
                {juegoActivo.id === "letras" && <JuegoLetras alTerminar={terminarJuego} />}
                {juegoActivo.id === "atrapa" && <JuegoAtrapa edad={perfil.edad} alTerminar={terminarJuego} />}
              </div>
            )}
          </div>
        </div>
      </div>
    );
  }

  if (pantalla === "panel") {
    return (
      <div className="min-h-screen bg-sky-100 p-3 sm:p-4">
        <div className="mx-auto flex max-w-md flex-col items-center gap-5 sm:gap-6">
          <div className="flex w-full flex-wrap items-center justify-between gap-2">
            <button onClick={() => setPantalla("menu")} className="flex items-center gap-1 rounded-full bg-white px-4 py-2 font-black text-slate-600 shadow active:scale-95">
              <ArrowLeft /> Volver
            </button>
            <span className="text-lg font-black text-slate-700 sm:text-xl">📊 Panel para padres</span>
          </div>
          <PanelPadres sesiones={sesiones} perfil={perfil} />
        </div>
      </div>
    );
  }

  const disponibles = JUEGOS.filter((j) => j.edades.includes(perfil.edad));
  return (
    <div className="min-h-screen bg-sky-100 p-3 pb-10 sm:p-4">
      <div className="mx-auto flex max-w-lg flex-col gap-5 sm:gap-6">
        <header className="flex flex-wrap items-center justify-between gap-3 pt-2">
          <div>
            <h1 className="text-2xl font-black text-sky-700 sm:text-3xl">🌈 ¡Hola, {perfil.nombre}!</h1>
            <p className="font-bold text-slate-500">¿A qué querés jugar hoy?</p>
          </div>
          <button onClick={() => setPantalla("panel")}
            className="flex items-center gap-2 rounded-full bg-white px-4 py-2 font-black text-slate-600 shadow active:scale-95">
            <BarChart3 /> Padres
          </button>
        </header>

        {Object.keys(AREAS).map((clave) => {
          const juegosArea = disponibles.filter((j) => j.area === clave);
          if (juegosArea.length === 0) return null;
          const a = AREAS[clave];
          return (
            <section key={clave} className={`rounded-3xl ${a.suave} p-4 sm:p-5`}>
              <h2 className={`mb-3 text-xl font-black sm:text-2xl ${a.texto}`}>{a.icono} {a.nombre}</h2>
              <div className="flex flex-col gap-3">
                {juegosArea.map((j) => (
                  <button key={j.id} onClick={() => abrirJuego(j)}
                    className="flex items-center gap-3 rounded-2xl bg-white p-3 text-left shadow-md transition-transform active:scale-95 sm:gap-4 sm:p-4">
                    <span className="text-3xl sm:text-4xl">{j.icono}</span>
                    <span className="text-lg font-black text-slate-700 sm:text-xl">{j.nombre}</span>
                    <Sparkles className="ml-auto shrink-0 text-yellow-400" />
                  </button>
                ))}
              </div>
            </section>
          );
        })}
      </div>
    </div>
  );
}
